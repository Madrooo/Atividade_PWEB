<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Esporte Escolar</title>

    <style> 
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #2c002a, #550051);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #fffeff;
            text-align: center;
        }
        legend {
            font-weight: bold;
            color: #fdfcfd;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #f7f7f7;
        }
        fieldset {
            border: 1px solid #f7a5f7;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #550051;
            border-radius: 5px;
        }
        input[type="text"], input[type="date"], input[type="tel"], select, textarea {
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        form{
            max-width: 600px;
            margin: auto;
        }

    </style>
</head>
<body>
    <h1>Formulário de Esporte Escolar</h1>
    <form>
        <fieldset> 
            <legend>Informações da escola</legend>

            <label for="escola">Nome da escola:</label>
            <input type="text" id="escola" name="escola">

            <label for="modalidade_esportiva">Modalidade esportiva:</label>
            <input type="text" id="modalidade_esportiva" name="modalidade_esportiva">

            <label for="professor">Professor responsável:</label>
            <input type="text" id="professor" name="professor">
        </fieldset>
           
        <fieldset> 
            <legend>Dados do aluno</legend>

            <label for="nome_aluno">Nome completo:</label>
            <input type="text" id="nome_aluno" name="nome_aluno">

            <label for="turma">Turma:</label>
            <input type="text" id="turma" name="turma">

            <label for="data_nasc">Data de nascimento:</label>
            <input type="date" id="data_nasc" name="data_nasc">
        </fieldset>

        <fieldset>
            <legend>Turno</legend>

            <input type="radio" id="matutino" name="turno" value="matutino">
            <label for="matutino">Matutino</label>

            <input type="radio" id="vespertino" name="turno" value="vespertino">
            <label for="vespertino">Vespertino</label>

            <input type="radio" id="noturno" name="turno" value="noturno">
            <label for="noturno">Noturno</label>
        </fieldset>

        <fieldset> 
            <legend>Modalidade esportiva</legend>

            <select name="modalidade" id="modalidade">
                <option value="nenhuma" selected disabled>Selecione uma modalidade</option>
                <option value="futsal">Futsal</option>
                <option value="volei">Vôlei</option>
                <option value="basquete">Basquete</option>
                <option value="handebol">Handebol</option>
                <option value="atletismo">Atletismo</option>
            </select>
        </fieldset>
        
        <fieldset>
            <legend>Já praticou essa modalidade anteriormente?</legend>

            <input type="radio" id="sim" name="praticou" value="sim">
            <label for="sim">Sim</label>

            <input type="radio" id="nao" name="praticou" value="nao">
            <label for="nao">Não</label>
        </fieldset>

        <fieldset>
            <legend>Possui algum problema de saúde?</legend>

            <input type="radio" id="sim_saude" name="possui_problema" value="sim">
            <label for="sim_saude">Sim</label>

            <input type="radio" id="nao_saude" name="possui_problema" value="nao">
            <label for="nao_saude">Não</label>

            <label for="problema_saude">Se sim, quais restrições de saúde?</label>
            <textarea id="problema_saude" name="problema_saude" rows="4"></textarea>
        </fieldset>

        <fieldset>
            <legend>Dados do responsável</legend>

            <label for="nome_responsavel">Nome do responsável:</label>
            <input type="text" id="nome_responsavel" name="nome_responsavel">

            <label for="telefone_responsavel">Telefone do responsável:</label>
            <input type="tel" id="telefone_responsavel" name="telefone_responsavel">
        </fieldset>

        <fieldset>
            <legend>Autorização</legend>

            <input type="checkbox" id="autorizacao" name="autorizacao">
            <label for="autorizacao">Autorizo a participação do aluno nas atividades esportivas.</label>
        </fieldset>
        
        <button type="submit">Enviar inscrição</button>
    </form>
</body>
</html>
